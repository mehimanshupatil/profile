name: generate-answers

# Regenerates Ask-me Answers and Lens intros with OpenUI Cloud when the Fact Base or
# Questions change, then opens a PR for human review (docs/adr/0002). Never auto-merges.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even if inputs are unchanged"
        type: boolean
        default: false

concurrency:
  group: generate-answers
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Generate answers
        run: pnpm generate:answers ${{ inputs.force && '--force' || '' }}
        env:
          OPENUI_API_KEY: ${{ secrets.OPENUI_API_KEY }}
          OPENUI_MODEL: ${{ vars.OPENUI_MODEL }}

      - name: Open review PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/answers
          add-paths: src/generated/answers.json
          commit-message: "chore: regenerate Ask-me answers"
          title: "Review regenerated Ask-me answers"
          body: |
            OpenUI Cloud regenerated the Ask-me Answers and Lens intros because the Fact Base,
            Questions or component library changed.

            Before merging, check every claim against the CV and Case Studies. Answers must not
            invent employers, dates, numbers or projects (docs/adr/0002).
          labels: generated
          delete-branch: true
