name: scoreboard

# Weekly Lighthouse run against every live site; results are data only, so they
# publish without review (unlike claims about the owner).
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: scoreboard
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Lighthouse
        run: node scripts/scoreboard.mjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/scoreboard.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: weekly Lighthouse scoreboard"
          git push

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy explicitly.
      - name: Deploy
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
